# 1 day = 1440 min
minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
# 7 days = 10080 min
trustPolicyIgnoreAfter: 10080

# TODO: check which can be upgraded to remove them, or check which verions are fine
trustPolicyExclude:
  - '@graphql-tools/batch-execute@9.0.19'
  - '@graphql-tools/delegate@10.2.23'
  - '@graphql-tools/executor-graphql-ws@2.0.7'
  - '@graphql-tools/executor-http@1.3.3'
  - '@graphql-tools/wrap@10.1.4'
  - eslint-config-prettier@9.1.2
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
  - ua-parser-js@1.0.41

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  sharp: false
  unrs-resolver: false

overrides:
  '@fastify/busboy@>=1.0.0 <3.2.1': ^3.2.1
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  brace-expansion@<5.0.12: ^5.0.12
  browserslist@<=4.28.6: ^4.28.7
  immutable@<5.1.8: ^5.1.8
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  lodash-es@<=4.17.23: '>=4.17.24'
  lodash@<=4.17.23: '>=4.17.24'
  nanoid@<3.3.18: ^3.3.18
  postcss@<8.5.23: ^8.5.23
  sharp@<0.35.3: ^0.35.3
  socket.io-parser@>=4.0.0 <4.2.7: ^4.2.7
  ws@>=8.0.0 <8.20.1: ^8.20.1
