name: aletheia
services:
  postgres:
    image: registry.access.redhat.com/hi/postgresql:18.6
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: aletheia
      POSTGRES_USER: aletheia
      POSTGRES_PASSWORD: aletheia
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    mem_limit: 100m
    # run as root, so the container user can read and update mounted data (on Windows)
    user: "0"

  server:
    image: xeeija/aletheia-server:1.14.1
    # build:
    #   context: server
    restart: unless-stopped
    ports:
      - 4000:4000
    env_file:
      - server/.env
    environment:
      DATABASE_URL: postgresql://aletheia:aletheia@postgres:5432/aletheia
      NODE_ENV: development
      EVENTSUB_STRICT_HOST_CHECK: 1
    volumes:
      - ./server/src/twitch/mock/data/token.json:/app/src/twitch/mock/data/token.json
    depends_on:
      - postgres
    # needed for twitch mock API server, so localhost (127.0.0.1) in container finds mock-api in host network
    extra_hosts:
      - localhost:host-gateway
    mem_limit: 200m

  web:
    image: xeeija/aletheia-web:1.14.1
    # build:
    #   context: web
    restart: unless-stopped
    ports:
      - 3001:3000
    env_file:
      - web/.env
    environment:
      SERVER_URL: http://server:4000
      SOCKET_SERVER_URL: http://server:4000
      ENVIRONMENT: docker
    mem_limit: 200m

  proxy:
    image: registry.access.redhat.com/hi/nginx:1.30.6
    restart: unless-stopped
    ports:
      - 3000:80
    # environment:
    #   SERVER_URL: server:4000
    #   WEB_URL: web:3000
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # logging see: https://docs.nginx.com/nginx/admin-guide/monitoring/logging/
      # - ./docker/data/proxy/log/nginx:/var/log/nginx
    mem_limit: 100m
